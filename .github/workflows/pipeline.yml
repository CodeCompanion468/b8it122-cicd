name: B8IT122 CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-demo-${{ github.sha }}
          path: dist/pipeline-demo.zip
          if-no-files-found: error
          retention-days: 14

  terraform:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive
      - working-directory: infrastructure/terraform
        run: terraform init -backend=false
      - working-directory: infrastructure/terraform
        run: terraform validate

  deploy-staging:
    name: Deploy to staging
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_STAGING_DEPLOY == 'true') || github.event_name == 'workflow_dispatch'
    needs: [quality, terraform]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-demo-${{ github.sha }}
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload immutable revision
        run: aws s3 cp dist/pipeline-demo.zip "s3://${{ vars.ARTIFACT_BUCKET }}/revisions/${GITHUB_SHA}.zip"
      - name: Deploy through Systems Manager
        id: deploy
        run: |
          cat > /tmp/ssm-parameters.json <<JSON
          {
            "commands": [
              "set -euo pipefail",
              "aws s3 cp s3://${{ vars.ARTIFACT_BUCKET }}/revisions/${GITHUB_SHA}.zip /tmp/pipeline-demo.zip",
              "systemctl stop pipeline-demo.service || true",
              "install -d -m 0755 -o pipeline-demo -g pipeline-demo /opt/pipeline-demo/current",
              "find /opt/pipeline-demo/current -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +",
              "unzip -q -o /tmp/pipeline-demo.zip -d /opt/pipeline-demo/current",
              "/opt/pipeline-demo/current/deploy/after_install.sh",
              "/opt/pipeline-demo/current/deploy/start.sh",
              "/opt/pipeline-demo/current/deploy/validate.sh"
            ]
          }
          JSON
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=${{ vars.INSTANCE_TAG_NAME }}" \
            --comment "GitHub ${GITHUB_SHA}" \
            --parameters file:///tmp/ssm-parameters.json \
            --query Command.CommandId \
            --output text)
          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$(aws ec2 describe-instances --filters Name=tag:Name,Values=${{ vars.INSTANCE_TAG_NAME }} Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)"
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 10 "${{ vars.STAGING_URL }}/health"
